## ═══════════════════════════════════════════════════════════════
## openvibe.today — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.today.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5100, systemd unit openvibe-today) renders every page and serves
## the API and the ICS feeds; nginx terminates TLS, redirects www → apex, rate-limits sign-in and the API, and
## compresses text.
##
## No proxy_cache: the app decides cacheability per response (public for the schedule and a channel's calendar;
## private, no-store for everything personal; private/public 5 minutes for the ICS feeds). Never log request
## bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=today_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=today_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=today_forms:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=today_ics:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.today www.openvibe.today;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.today$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.today;

    ssl_certificate     /etc/letsencrypt/live/openvibe.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.today/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.today$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.today;
    include snippets/security-txt.conf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.today/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.today.access.log;
    error_log  /var/log/nginx/openvibe.today.error.log;

    # The API's JSON body cap is 64 KB; leave room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml text/calendar;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=today_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5100;
    }

    location /auth/ {
        limit_req zone=today_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5100;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=today_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5100;
    }

    # ── ICS feeds: a calendar client only ever GETs them ────
    location /ics/ {
        limit_except GET { deny all; }
        limit_req zone=today_ics burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5100;
    }

    # ── Forms and other writes ──────────────────────────────
    location ~ ^/(schedule|me/feed/rotate|e/[A-Za-z0-9_]+/(remind|remind/remove|cancel))$ {
        limit_req zone=today_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5100;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5100/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── OpenVibe.Events' delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:5100/internal/events directly. Never proxied from outside (ADR-033).
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:5100;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
